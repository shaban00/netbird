# Fork release: builds upstream's GoReleaser targets and publishes them under
# this fork's names. Kept separate from upstream's release.yml (disabled in
# this fork) so syncing with upstream never conflicts.
#
# Triggered by a tag of the form vX.Y.Z-spydasec.N, where X.Y.Z is the upstream
# release it is based on and N counts this fork's builds of it:
#
#   git tag v0.83.1-spydasec.1 && git push origin v0.83.1-spydasec.1
#
# Publishes:
#   - Docker images (multi-arch) to Docker Hub $DOCKERHUB_NAMESPACE/<image>
#     and ghcr.io/$GHCR_NAMESPACE/<image>, tagged with the version and, for the
#     newest fork release, latest
#   - netbird-caddy and netbird-crowdsec (.github/fork/images), used by
#     install-server.sh, to the same registries with the same tags
#   - a GitHub Release with the CLI binaries, unsigned .deb/.rpm and Arch Linux
#     packages, checksums, and the install-*.sh scripts (release-scripts.py)
#   - the desktop app (netbird-ui) for Linux (GTK4 amd64/arm64 and GTK3, as
#     archives and .deb/.rpm/Arch packages), Windows and macOS, added to the
#     same release by the release_ui jobs. Unsigned: NetBird signs its own
#     builds and makes the Windows/macOS installers in a private pipeline.
#
# Dry run: start "Fork release" by hand from the Actions tab to build
# everything (binaries, packages, all images) without publishing anything.
#
# Needs repository secrets DOCKER_USER and DOCKER_TOKEN (a Docker Hub access
# token with read/write access). GHCR uses the workflow's own token.
name: Fork release

on:
  push:
    tags:
      - "v*-spydasec.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Dry run only: version to build as (nothing is published)"
        default: "v0.0.0-spydasec.0"

permissions:
  contents: write
  packages: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  GORELEASER_VER: "v2.16.0"
  PRODUCT_NAME: "NetBird"
  COPYRIGHT: "NetBird GmbH"
  DOCKERHUB_NAMESPACE: spydasec
  GHCR_NAMESPACE: ${{ github.repository_owner }}

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      patch: ${{ steps.version.outputs.patch }}
      skip_latest: ${{ steps.version.outputs.skip_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # It is required for GoReleaser to work properly
          persist-credentials: false
      - name: Fetch upstream release tags
        # Fork tags (vX.Y.Z-spydasec.N) are semver prereleases, which the RPM
        # changelog generator skips, so it needs upstream's release tags. They
        # also make the release notes list what this release adds on top of
        # the upstream version. Fetched into this checkout only, never pushed.
        run: git fetch --no-recurse-submodules https://github.com/netbirdio/netbird.git '+refs/tags/v*:refs/tags/v*'

      - name: Validate tag and decide whether it moves latest
        id: version
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DRY_RUN_VERSION"
            echo "GORELEASER_FLAGS=--snapshot" >> "$GITHUB_ENV"
            # The RPM changelog needs a version tag. This one exists only in
            # the runner's checkout and is never pushed.
            git tag "$tag"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-spydasec\.[0-9]+$ ]]; then
            echo "::error::tag $tag must look like v0.83.1-spydasec.1"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "major=${BASH_REMATCH[1]}"
            echo "minor=${BASH_REMATCH[2]}"
            echo "patch=${BASH_REMATCH[3]}"
          } >> "$GITHUB_OUTPUT"

          # Only the newest fork release moves the latest tags, so rebuilding
          # an older one cannot drag latest backwards. Upstream tags are ignored.
          newest=$(git tag -l 'v*-spydasec.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-spydasec\.[0-9]+$' | sort -V | tail -n1)
          if [[ "$tag" == "$newest" ]]; then
            echo "SKIP_LATEST=false" >> "$GITHUB_ENV"
            echo "skip_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "SKIP_LATEST=true" >> "$GITHUB_ENV"
            echo "skip_latest=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is older than $newest; latest tags are left alone"
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          cache: false
      - name: Cache Go modules
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-releaser-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-releaser-
      - name: Generate RPM changelog from git tags
        run: bash release_files/rpm-changelog.sh
      - name: Fill the RPM ISA provide version
        # Upstream's script reads the version from GITHUB_REF; a dry run has no tag.
        run: GITHUB_REF="refs/tags/$RELEASE_TAG" bash release_files/rpm-provides.sh
      - name: Generate the fork's release scripts
        # install-client.sh and the install-*.sh service scripts, pointing at
        # this release's images (RELEASE_TAG). GoReleaser only attaches files
        # inside the checkout, and bin/ is git-ignored, so they cannot make the
        # working tree dirty.
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: python3 .github/fork/release-scripts.py bin/fork-release
      - name: Generate the fork's GoReleaser config
        # Written outside the checkout: GoReleaser refuses to release from a
        # working tree with untracked files.
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: FORK_RELEASE_FILES=bin/fork-release bash .github/fork/goreleaser-config.sh .goreleaser.generated.yaml "$RUNNER_TEMP/goreleaser.fork.yaml"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install proxy web dependencies for license collection
        working-directory: proxy/web
        run: npm ci --ignore-scripts
      - name: Build the recorder web UI
        # recorder/web/web.go embeds recorder/web/out, which is not committed.
        working-directory: recorder/web
        run: npm ci && npm run build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 #v4.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 #v4.1.0
      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Log in to the GitHub container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the Caddy and CrowdSec images
        # install-server.sh deploys these next to the release's own images.
        # A dry run builds them without pushing.
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for image in caddy crowdsec; do
            tags=()
            for repo in "$DOCKERHUB_NAMESPACE/netbird-$image" "ghcr.io/$GHCR_NAMESPACE/netbird-$image"; do
              tags+=(--tag "$repo:$version")
              [[ "$SKIP_LATEST" == "false" ]] && tags+=(--tag "$repo:latest")
            done
            push=--push
            [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && push=
            docker buildx build --platform linux/amd64,linux/arm64 \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$version" \
              "${tags[@]}" $push ".github/fork/images/$image"
          done

      - name: Install OS build dependencies
        run: sudo apt update && sudo apt install -y -q gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu

      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@b66839b # v1.7.0
      - name: Generate windows syso
        env:
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
          PATCH: ${{ steps.version.outputs.patch }}
        run: |
          set -euo pipefail
          ver="$MAJOR.$MINOR.$PATCH"
          common=(-icon client/ui/build/windows/icon.ico -manifest client/manifest.xml
            -product-name "$PRODUCT_NAME" -copyright "$COPYRIGHT"
            -ver-major "$MAJOR" -ver-minor "$MINOR" -ver-patch "$PATCH" -ver-build 0
            -file-version "$ver.0" -product-version "$ver.0")
          goversioninfo "${common[@]}" -o client/resources_windows_amd64.syso
          goversioninfo -arm -64 "${common[@]}" -o client/resources_windows_arm64.syso

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: ${{ env.GORELEASER_VER }}
          args: release --config ${{ runner.temp }}/goreleaser.fork.yaml --clean ${{ env.GORELEASER_FLAGS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_PUBLISH: "false"
          SKIP_DOCKER_PUSH: "false"
          SKIP_LATEST: ${{ env.SKIP_LATEST }}

  release_ui:
    # The desktop app, built from upstream's .goreleaser_ui*.yaml configs
    # (adapted by goreleaser-ui-config.sh) and added to the release made by
    # the release job, which runs first so its release notes are in place.
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64 and Windows
            # Cross-compiles Windows with MinGW (amd64) and LLVM-MinGW (arm64).
            runner: ubuntu-24.04
            config: .goreleaser_ui.yaml
            packages: libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev gcc-mingw-w64-x86-64
            windows: true
          - name: Linux arm64
            # The UI links GTK4 and WebKitGTK through cgo: built natively.
            runner: ubuntu-24.04-arm
            config: .goreleaser_ui_linux_arm64.yaml
            packages: libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev
          - name: Linux GTK3
            # For distros without WebKitGTK 6.0; 22.04 for the oldest glibc.
            runner: ubuntu-22.04
            config: .goreleaser_ui_gtk3.yaml
            packages: libgtk-3-dev libwebkit2gtk-4.1-dev
            wails_tags: gtk3
          - name: macOS
            runner: macos-latest
            config: .goreleaser_ui_darwin.yaml
    name: Desktop app (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      SKIP_LATEST: ${{ needs.release.outputs.skip_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # It is required for GoReleaser to work properly
          persist-credentials: false
      - name: Dry run setup
        if: github.event_name == 'workflow_dispatch'
        # As in the release job: build as the dry-run version, publish nothing.
        run: |
          git tag "$RELEASE_TAG"
          echo "GORELEASER_FLAGS=--snapshot" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - name: Install OS build dependencies
        if: matrix.packages
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          sudo apt update
          # shellcheck disable=SC2086 # a list of package names
          sudo apt install -y -q $PACKAGES
      - name: Install wails3 CLI
        # Version derived from go.mod so the binding generator always matches
        # the wails runtime the binary links against.
        env:
          WAILS_TAGS: ${{ matrix.wails_tags }}
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install -tags "$WAILS_TAGS" "github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION"
      - name: Install yq
        # Preinstalled on the x64 Ubuntu runners only.
        run: command -v yq >/dev/null || go install github.com/mikefarah/yq/v4@v4.45.1

      - name: Install LLVM-MinGW for Windows arm64
        if: matrix.windows
        run: |
          cd "$RUNNER_TEMP"
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20250709/llvm-mingw-20250709-ucrt-ubuntu-22.04-x86_64.tar.xz
          echo "60cafae6474c7411174cff1d4ba21a8e46cadbaeb05a1bace306add301628337  llvm-mingw-20250709-ucrt-ubuntu-22.04-x86_64.tar.xz" | sha256sum -c
          tar -xf llvm-mingw-20250709-ucrt-ubuntu-22.04-x86_64.tar.xz
          echo "$RUNNER_TEMP/llvm-mingw-20250709-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
      - name: Generate Windows syso
        if: matrix.windows
        env:
          MAJOR: ${{ needs.release.outputs.major }}
          MINOR: ${{ needs.release.outputs.minor }}
          PATCH: ${{ needs.release.outputs.patch }}
        run: |
          set -euo pipefail
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@b66839b # v1.7.0
          ver="$MAJOR.$MINOR.$PATCH"
          common=(-icon client/ui/build/windows/icon.ico -manifest client/ui/build/windows/wails.exe.manifest
            -product-name "$PRODUCT_NAME-UI" -copyright "$COPYRIGHT"
            -ver-major "$MAJOR" -ver-minor "$MINOR" -ver-patch "$PATCH" -ver-build 0
            -file-version "$ver.0" -product-version "$ver.0")
          goversioninfo -64 "${common[@]}" -o client/ui/resources_windows_amd64.syso
          goversioninfo -arm -64 "${common[@]}" -o client/ui/resources_windows_arm64.syso

      - name: Generate the fork's GoReleaser config
        # Written outside the checkout: GoReleaser refuses a dirty working tree.
        env:
          CONFIG: ${{ matrix.config }}
        run: bash .github/fork/goreleaser-ui-config.sh "$CONFIG" "$RUNNER_TEMP/goreleaser-ui.fork.yaml"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: ${{ env.GORELEASER_VER }}
          args: release --config ${{ runner.temp }}/goreleaser-ui.fork.yaml --clean ${{ env.GORELEASER_FLAGS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
